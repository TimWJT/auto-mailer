name: release

# Tag a commit to cut a release:
#   git tag v1.0.0 && git push origin v1.0.0
# Installers for Windows and both kinds of Mac are built and attached to a
# DRAFT release, which you review and publish by hand from the Releases page.
#
# The Microsoft sign-in client ID comes from the repository variable
# AUTO_MAILER_MS_CLIENT_ID (Settings → Secrets and variables → Actions →
# Variables). It is not a secret. Without it, the build works but the
# "Sign in with Microsoft" button is disabled.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  installers:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Test
        run: npm test
        timeout-minutes: 20

      - uses: tauri-apps/tauri-action@v0
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTO_MAILER_MS_CLIENT_ID: ${{ vars.AUTO_MAILER_MS_CLIENT_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Auto Mailer ${{ github.ref_name }}'
          releaseBody: |
            ## Which file do I download?

            Pick **one** file from **Assets** below. You can ignore everything else.

            | Your computer | Download the file ending in |
            |---|---|
            | **Windows** | **`_x64-setup.exe`** |
            | **Mac with Apple silicon** (M1, M2, M3, M4…) | **`_aarch64.dmg`** |
            | **Mac with Intel** | **`_x64.dmg`** |

            Not sure which Mac you have? Apple menu → **About This Mac**. "Chip: Apple M…"
            means Apple silicon; "Processor: Intel" means Intel.

            ### First launch warnings

            Auto Mailer is free and not code-signed, so your computer will warn you once:

            - **Windows** — "Windows protected your PC": click **More info**, then **Run anyway**.
            - **Mac** — open the app once (it will be blocked), then go to **System Settings → Privacy & Security**, scroll down and click **Open Anyway**.

            See the README for how to connect Gmail (app password) and Microsoft accounts.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
